[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-proposing"
version = "0.2.0"
description = "Agentic Proposing: closed-loop task synthesis with compositional skills and tool use."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agentic Proposing Authors"}]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
pdf = ["pypdf>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "PyYAML>=6.0", "pypdf>=5.0"]
training = [
  "torch>=2.4",
  "transformers>=4.56,<5",
  "accelerate>=1.4",
  "datasets>=3.0",
  "trl==0.25.0",
]

[project.scripts]
agentic-proposing = "agentic_proposing.cli:main"
agentic-proposing-train = "agentic_proposing.training.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_proposing = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
